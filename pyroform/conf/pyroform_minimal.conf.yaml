# Minimal Pyroform Configuration
# For basic usage and testing

safety_checks: true
default_output_dir: "/tmp/pyroform"
log_level: "INFO"
auto_confirm: false
dry_run: false

flowctrl:
  state_file: "/tmp/pyroform_state.json"
  logging:
    level: "INFO"
    file: "/tmp/pyroform.log"
  execution:
    max_retries: 3
    timeout: 300
  reporting:
    generate_reports: true
    report_dir: "/tmp/pyroform/reports"

scorch:
  safety_check: true
  protected_users: ["root", "daemon", "bin", "sys"]
  protected_groups: ["root", "daemon", "bin", "sys"]
  protected_mounts: ["/", "/boot", "/home", "/var", "/tmp"]

validation:
  check_users: true
  check_groups: true
  check_mounts: true
  check_files: true
